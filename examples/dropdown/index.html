<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudan Location Picker Example</title>
<style>
  :root { --bg: #f6f7f4; --surface: #fff; --text: #1b211e; --muted: #5d6762; --line: #dfe3de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131715; --surface: #1c211e; --text: #e8ece9; --muted: #9ba5a0; --line: #2f3632; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", "Noto Sans Arabic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 1.4rem; }
  p { margin: 0; color: var(--muted); }
  form { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  select, input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  output { font-family: ui-monospace, Menlo, monospace; }
  [dir="rtl"] form { direction: rtl; }
</style>
</head>
<body>
<main>
  <h1>Sudan Atlas: state and locality picker</h1>
  <p>Pick a state and the locality list fills with that state's localities. Or type a name in any spelling and let <code>match()</code> choose both.</p>
  <label><input type="checkbox" id="arabic"> Arabic labels</label>
  <form id="form">
    <label for="name">Type a name
      <input id="name" placeholder="e.g. El Fasher, الفاشر, Gezira South" autocomplete="off">
    </label>
    <label for="state">State <select id="state" required></select></label>
    <label for="locality">Locality <select id="locality" required disabled></select></label>
    <p>Selected P-code: <output id="code">none</output></p>
  </form>
</main>
<script type="module">
const params = new URLSearchParams(location.search);
const atlas = await import(params.get("lib") || "https://cdn.jsdelivr.net/npm/sudan-atlas@0.1.0/dist/index.js");
const $ = (id) => document.getElementById(id);
const label = (p) => ($("arabic").checked ? p.name_ar : p.name_en);

function fillStates() {
  const current = $("state").value;
  $("state").replaceChildren(new Option("Choose a state…", ""), ...atlas.getStates().map((s) => new Option(label(s), s.pcode)));
  $("state").value = current;
}
function fillLocalities(selected = "") {
  const state = $("state").value;
  $("locality").disabled = !state;
  $("locality").replaceChildren(new Option(state ? "Choose a locality…" : "Choose a state first", ""),
    ...(state ? atlas.getLocalities(state).map((l) => new Option(label(l), l.pcode)) : []));
  $("locality").value = selected;
  $("code").value = $("locality").value || state || "none";
}

$("state").addEventListener("change", () => fillLocalities());
$("locality").addEventListener("change", () => { $("code").value = $("locality").value || $("state").value || "none"; });
$("arabic").addEventListener("change", () => {
  document.body.dir = $("arabic").checked ? "rtl" : "ltr";
  const locality = $("locality").value;
  fillStates(); fillLocalities(locality);
});
$("name").addEventListener("change", () => {
  const result = atlas.match($("name").value, { level: 2 });
  if (result.pcode) {
    const place = atlas.getPlace(result.pcode);
    $("state").value = place.parent_pcode;
    fillLocalities(place.pcode);
  } else {
    $("code").value = result.alternatives.length ? `not sure: ${result.alternatives.map((a) => a.name_en).join(", ")}?` : "no match";
  }
});
$("form").addEventListener("submit", (e) => e.preventDefault());
fillStates(); fillLocalities();
</script>
</body>
</html>
