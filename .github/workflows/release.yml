name: Release packages

# Publishing a GitHub release tagged packages-v<version> (for example packages-v0.1.0) tests, builds
# and publishes both packages. npm and PyPI trust this workflow directly ("trusted publishing"), so no
# token is stored in the repository. Running it by hand (Actions -> Release packages -> Run workflow)
# only tests and builds: a rehearsal that publishes nothing. Other releases (data releases such as
# 2026.1, or a citation snapshot archived by Zenodo) are skipped. See docs/PUBLISHING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      github_packages:
        description: "Also publish the npm package to GitHub Packages (npm and PyPI are published only by a release)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'packages-v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the versions agree (and match the release tag)
        id: version
        run: |
          js=$(node -p "require('./packages/js/package.json').version")
          py=$(python -c "import tomllib; print(tomllib.load(open('packages/py/pyproject.toml', 'rb'))['project']['version'])")
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' packages/py/src/sudan_atlas/__init__.py)
          echo "npm $js, PyPI $py, __version__ $init"
          [ "$js" = "$py" ] && [ "$py" = "$init" ] || { echo "::error::Set the same version in all three files"; exit 1; }
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.tag_name }}" != "packages-v$js" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} should be packages-v$js"; exit 1
          fi
          echo "version=$js" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r pipeline/requirements.txt
          npm ci
          (cd packages/js && npm ci)
      - name: Test both packages
        run: |
          make test
          (cd packages/js && npm run typecheck && npm test)
      - name: Build
        run: |
          make packages
          .venv/bin/twine check packages/py/dist/*
          mkdir -p npm-dist && (cd packages/js && npm pack --pack-destination ../../npm-dist)
      - uses: actions/upload-artifact@v4
        with:
          name: pypi
          path: packages/py/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: npm-dist/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a version already on PyPI is left alone, so a re-run is safe

  npm:
    name: Publish to npm
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          # npm cannot record provenance for a private repository; it does once the repository is public.
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          npm install -g "npm@>=11.5.1"  # trusted publishing needs npm 11.5.1 or later
          if npm view "sudan-atlas@$VERSION" version >/dev/null 2>&1; then
            echo "sudan-atlas@$VERSION is already on npm; nothing to do."
            exit 0
          fi
          npm publish "./sudan-atlas-$VERSION.tgz" --access public --provenance="$PROVENANCE"

  github-packages:
    # A copy of the npm package on GitHub Packages, so it shows on the repository page. GitHub's
    # registry needs a scoped name, so it is published as @aminshennan/sudan-atlas; installing from
    # it needs a GitHub token, so npm (unscoped sudan-atlas) stays the place to install from.
    name: Publish to GitHub Packages
    needs: build
    if: github.event_name == 'release' || inputs.github_packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@aminshennan"
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@aminshennan/sudan-atlas@$VERSION" version >/dev/null 2>&1; then
            echo "@aminshennan/sudan-atlas@$VERSION is already on GitHub Packages; nothing to do."
            exit 0
          fi
          tar -xzf "sudan-atlas-$VERSION.tgz"
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package/package.json", "utf8"));
            p.name = "@aminshennan/sudan-atlas";
            p.publishConfig = { registry: "https://npm.pkg.github.com", access: "public" };
            fs.writeFileSync("package/package.json", JSON.stringify(p, null, 2) + "\n");
          '
          npm publish ./package
